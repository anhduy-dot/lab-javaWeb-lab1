<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title th:text="|${appName} - Trợ giúp|">Trợ giúp</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<header>
		<h1 th:text="${appName}">Tên hệ thống</h1>
		<p>Môn học: <span th:text="${subject}">Tên môn học</span></p>
		<p>Học kỳ: <span th:text="${semester}">Học kỳ</span></p>
	</header>

	<nav th:replace="~{fragments/menu :: menu}"></nav>

	<main>
		<p class="message" th:text="${message}">Thông báo</p>
		<h2>Trợ giúp</h2>
		<p>Dùng menu phía trên để chuyển giữa các trang Trang chủ, Giới thiệu và Trợ giúp.</p>
	</main>
</body>
</html>
